<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Restaurant Order Form</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="project.css" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">Restaurant</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNavDropdown">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="#">Locations</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Menus</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Catering</a>
            <ul class="dropdown-menu dropdown-menu-dark">
              <li><a class="dropdown-item" href="#">Private Events</a></li>
              <li><a class="dropdown-item" href="#">Corporate Orders</a></li>
            </ul>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">About</a>
            <ul class="dropdown-menu dropdown-menu-dark">
              <li><a class="dropdown-item" href="#">Our Story</a></li>
              <li><a class="dropdown-item" href="#">Team</a></li>
            </ul>
          </li>
          <li class="nav-item"><a class="nav-link" href="#">Do Good</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Order Form Section -->
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow-sm">
          <div class="card-header text-white text-center">
            <h4>Add Food Item</h4>
          </div>
          <div class="card-body">
            <form id="foodForm">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="foodName" class="form-label">Food Name</label>
                  <input type="text" class="form-control" id="foodName" required />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="price" class="form-label">Price</label>
                  <input type="number" class="form-control" id="price" step="0.01" min="0" required />
                </div>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="category" class="form-label">Category</label>
                  <select class="form-select" id="category" required>
                    <option value="">Select Category</option>
                    <option value="Punjabi">Punjabi</option>
                    <option value="Chinese">Chinese</option>
                    <option value="South Indian">South Indian</option>
                    <option value="Cold Drink">Cold Drink</option>
                    <option value="Buttermilk">Buttermilk</option>
                    <option value="Dessert">Dessert</option>
                  </select>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="description" class="form-label">Description</label>
                  <input class="form-control" id="description" placeholder="Optional..." />
                </div>
              </div>
              <div class="d-flex justify-content-between">
                <button type="button" class="btn btn-secondary" onclick="addItem()">Add More Item</button>
                <button type="button" class="btn btn-success" onclick="submitOrder()">Submit Order</button>
              </div>
            </form>
          </div>
        </div>

        <!-- Order Summary -->
        <div class="card mt-4">
          <div class="card-header bg-info text-white">
            <h5 class="mb-0">Order Summary</h5>
          </div>
          <div class="card-body">
            <ul id="orderList" class="list-group mb-3"></ul>
            <h5>Total:<span id="totalAmount">0.00</span></h5>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Order Logic -->
  <script>
    let orderItems = [];

    function addItem() {
      const name = document.getElementById("foodName").value.trim();
      const price = parseFloat(document.getElementById("price").value);
      const category = document.getElementById("category").value;
      const description = document.getElementById("description").value.trim();

      if (!name || isNaN(price) || price < 0 || !category) {
        alert("Please fill all required fields correctly.");
        return;
      }

      const item = { name, price, category, description };
      orderItems.push(item);
      updateOrderList();
      updateTotal(); // ✅ Ensure total updates

      document.getElementById("foodForm").reset();
      document.getElementById("foodName").focus();
    }

    function updateOrderList() {
      const list = document.getElementById("orderList");
      list.innerHTML = "";

      orderItems.forEach((item, index) => {
        const li = document.createElement("li");
        li.className = "list-group-item d-flex justify-content-between align-items-center";
        li.innerHTML = `
          <div>
            <strong>${item.name}</strong> (${item.category}) - ${item.price.toFixed(2)}
            <br />
            <small class="text-muted">${item.description || ""}</small>
          </div>
          <button class="btn btn-sm btn-danger" onclick="removeItem(${index})">Remove</button>
        `;
        list.appendChild(li);
      });

      updateTotal(); // ✅ Recalculate after removal
    }

    function removeItem(index) {
      orderItems.splice(index, 1);
      updateOrderList();
      updateTotal(); // ✅ Update after removing
    }

    function updateTotal() {
      const total = orderItems.reduce((sum, item) => sum + item.price, 0);
      document.getElementById("totalAmount").textContent = total.toFixed(2);
    }

    function submitOrder() {
      if (orderItems.length === 0) {
        alert("No items in the order.");
        return;
      }

      updateTotal(); // ✅ Recalculate before submitting
      const total = document.getElementById("totalAmount").textContent;

      alert(`Order submitted successfully! Total amount: ${total}`);

      orderItems = [];
      updateOrderList();
      updateTotal(); // ✅ Reset total
    }
  </script>
</body>
</html>
